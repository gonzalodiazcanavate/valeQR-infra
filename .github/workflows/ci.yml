name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh compose/initdb/*.sh
      - name: compose
        env:
          API_TAG: sha-ci
          POSTGRES_PASSWORD: ci
          AUTOQR_OWNER_PASSWORD: ci
          AUTOQR_APP_PASSWORD: ci
          APP_DOMAIN: app.example.test
          API_DOMAIN: api.example.test
        run: |
          docker compose -f compose/docker-compose.yml config -q
          docker compose -f compose/dev.yml config -q
      - name: caddy
        run: |
          docker run --rm -e APP_DOMAIN=app.example.test -e API_DOMAIN=api.example.test \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/docs-check.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
