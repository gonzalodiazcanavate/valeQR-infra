name: Deploy API

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la imagen del API (sha-<commit> o vX.Y.Z)'
        required: true

# Configurar reviewers obligatorios en el environment "production".
concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validar tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^(sha-[0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "Tag no válido"; exit 1; }
      - name: Preparar SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Desplegar
        env:
          TAG: ${{ inputs.tag }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$HOST" "cd /opt/valeQR-infra && git pull --ff-only && scripts/deploy.sh '$TAG'"
